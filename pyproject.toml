[project]
name = "github-pr-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "fastmcp>=3.2.4",
    "gradio[mcp]>=6.13.0",
    "huggingface-hub[mcp]>=0.32.0",
    "mcp[cli]>=1.27.0",
    "python-dotenv>=1.2.2",
    "smolagents[mcp]>=1.22.0",
    "textblob>=0.20.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.bandit]
exclude_dirs = ["tests", "venv"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

